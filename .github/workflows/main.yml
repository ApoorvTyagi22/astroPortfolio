name: Deploy Astro Website via SSH

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy with rsync
        uses: easing-themes/ssh-deploy@v5.1.1
        with:
          # The private key for SSH access
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # The remote host, from your hosting provider
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          # The remote user
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          # The source directory on the runner
          SOURCE: "dist/"
          # The target directory on your server
          TARGET: "public_html/"
