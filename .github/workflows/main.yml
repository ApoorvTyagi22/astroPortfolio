name: Deploy Astro Website via SSH

on:
  push:
    branches: [live]

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }} # set to 65002 in repo secrets
      DOCROOT: /home/u749228359/public_html/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script_stop: true
          script: |
            mkdir -p "$DOCROOT"

      - name: Check rsync on server
        id: check_rsync
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script_stop: true
          script: |
            command -v rsync >/dev/null 2>&1

      # When rsync isn't available, clean docroot so SCP copy is exact
      - name: Clean target (when rsync unavailable)
        if: steps.check_rsync.outcome != 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            # keep Let's Encrypt files if present
            find "$DOCROOT" -mindepth 1 -maxdepth 1 \
              -not -name '.well-known' \
              -exec rm -rf {} +

      - name: Deploy with rsync
        if: steps.check_rsync.outcome == 'success'
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ env.SSH_KEY }}
          REMOTE_HOST: ${{ env.SSH_HOST }}
          REMOTE_USER: ${{ env.SSH_USER }}
          REMOTE_PORT: ${{ env.SSH_PORT }}
          SOURCE: "dist/"
          TARGET: "${{ env.DOCROOT }}"
          ARGS: "-avz --delete"

      - name: Deploy with SCP (fallback)
        if: steps.check_rsync.outcome != 'success'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: |
            dist/**
            dist/.*
          target: "${{ env.DOCROOT }}"
          strip_components: 1
          overwrite: true

      - name: Stamp release & list files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script_stop: true
          script: |
            printf "%s\n" "${GITHUB_SHA}" > "$DOCROOT/.deploy_sha"
            echo "Deployed to: $(readlink -f "$DOCROOT")"
            ls -lah "$DOCROOT" | sed -n '1,60p'
