name: Deploy Astro Website via SSH

on:
  push:
    branches: [live]

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }} # set this secret if your host isn't on 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install and Build
        run: |
          npm ci
          npm run build

      # Fail fast if the runner can't reach your SSH endpoint
      - name: Connectivity check (DNS + TCP)
        run: |
          set -euo pipefail
          : "${SSH_PORT:=22}"
          echo "Resolving $SSH_HOST ..."
          getent ahosts "$SSH_HOST" || true
          echo "Testing TCP $SSH_HOST:$SSH_PORT ..."
          timeout 5 bash -lc "cat < /dev/null > /dev/tcp/$SSH_HOST/$SSH_PORT" \
            && echo "TCP OK" || (echo "Cannot reach $SSH_HOST:$SSH_PORT from GitHub runner"; exit 1)

      # Make sure the remote folder exists (works for both rsync and scp)
      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script_stop: true
          script: |
            mkdir -p /home/u749228359/public_html/

      # Probe the server for rsync
      - name: Check rsync on server
        id: check_rsync
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script_stop: true
          script: |
            command -v rsync >/dev/null 2>&1

      - name: Deploy with rsync
        if: steps.check_rsync.outcome == 'success'
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ env.SSH_KEY }}
          REMOTE_HOST: ${{ env.SSH_HOST }}
          REMOTE_USER: ${{ env.SSH_USER }}
          REMOTE_PORT: ${{ env.SSH_PORT }}
          SOURCE: "dist/"
          TARGET: "/home/u749228359/public_html/"
          ARGS: "-avz --delete"

      - name: Deploy with SCP (fallback)
        if: steps.check_rsync.outcome != 'success'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "dist/*"
          target: "/home/u749228359/public_html/"

      # Optional: deeper SSH debug if things still fail
      - name: Debug SSH handshake
        if: failure()
        run: |
          set -x
          : "${SSH_PORT:=22}"
          umask 077
          printf "%s\n" "$SSH_KEY" > key.pem
          ssh -vvv -o StrictHostKeyChecking=accept-new -i key.pem -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "echo connected && uname -a || true"
